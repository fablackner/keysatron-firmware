# OpenOCD configuration for Keysatron (STM32F405 via ST-LINK)

source [find interface/stlink.cfg]
transport select hla_swd

source [find target/stm32f4x.cfg]

# Connect under reset for reliable connection
reset_config srst_only srst_nogate connect_assert_srst

# Keep adapter speed at 480 kHz for signal integrity over jumper wires
adapter speed 480

stm32f4x.cpu configure -event reset-start {
    adapter speed 480
}

stm32f4x.cpu configure -event reset-init {
    adapter speed 480
}
